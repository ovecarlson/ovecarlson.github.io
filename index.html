  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0 200px;
      font-family: Arial, sans-serif;
      background: #fff;
    }

    .gallery {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 48px;
      padding: 80px 0;
    }

    .item {
      text-align: center;
    }

    .item a {
      display: block;
      text-decoration: none;
      color: inherit;
    }

    .item img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 6px;
    }

    .caption {
 <!-- margin-top: 8px;
      font-size: 1,5rem;
      line-height: 1.3; -->
      font-size: clamp(14px, 1.2vW, 20px);
    }

    /* Surfplattor */
    @media (max-width: 900px) {
      body {
        padding: 0 30px;
      }

      .gallery {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    /* Mobiler */
    @media (max-width: 520px) {
      body {
        padding: 0 16px;
      }

      .gallery {
        grid-template-columns: 1fr;
        gap: 56px;
      }
    }
  </style>
</head>
