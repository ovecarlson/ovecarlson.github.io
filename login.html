<!DOCTYPE html>

    <style>
        #login{
            margin: auto;

        body, html{
            height:100%;

        body {
            display: flex;
            margin: 0;

        }
        #menuRow {
    text-align: center;
    vertical-align: middle;
}

a {
    
    cursor: pointer;
}

#menuRow div:not(:first-child) {
    margin-top: 5px;
}
.menuLink {
    text-align: center;
}

.menuLink a {
    color: #333;
    text-decoration: underline;
    cursor: pointer;
}

.centerImage {
	text-align:center;
}

.dropdown {
    position: relative;
    display: inline-block;
}

.dropdown-content {
    display: none;
    position: absolute;
    top: 70%;
    left: 50%;
    margin-left:-50px;
    background-color: #F8F8FF;
    min-width: 100px;
    border:1px solid black;
    padding: 15px 5px;
    z-index:1;
}

.dropdown:hover .dropdown-content {
    display: block;
}
    </style>
    <link href="static/css/bootstrap.css" rel="stylesheet">
    <link href="static/css/bootstrap-theme.css" rel="stylesheet">
