        $(document).ready(function() {
            updateImage();
            setInterval(updateImage, 3000);
        });

        function updateImage() {
            var date = new Date();
            var sec = date.getSeconds();
            var min = date.getMinutes();
            var current = Math.ceil(sec/6) + min * 10;
            var newSrc = "artomatic/images/" + current + ".png?" + Date.now();
            $("#artomatic").attr("src", newSrc);
        }
